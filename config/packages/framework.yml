framework:
    translator:
        fallback: en_US
    secret: '%env(APP_SECRET)%'
    form: true
    csrf_protection: true
    validation:
        enable_attributes: true
        enabled: true
    default_locale: '%env(APP_DEFAULT_LOCALE)%'
    session:
        name: BAPID
        handler_id: session.handler.pdo
        gc_maxlifetime: 3600
        cookie_samesite: 'lax' # needed to not be strict for SSO and Apps oAuth2 workflows
        cookie_secure: auto
        cookie_httponly: true
    serializer:
        enabled: true
    assets:
        packages:
            frontend:
                version_strategy: pim_enrich.version_strategy
    cache:
        pools:
            name:
                adapter: cache.adapter.apcu
    rate_limiter:
        # Unauthenticated endpoint, so the key is the client IP and EVERY request counts.
        # Deliberately not the login lock's numbers: that one is per-account and counts only
        # failed attempts, so 5 per 5 minutes is generous there and punitive here — a whole
        # office behind one NAT address shares this bucket.
        reset_password:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
