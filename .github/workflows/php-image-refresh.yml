name: refresh-php-image

# The CI PHP image is tagged by Dockerfile content hash and skipped if the tag exists, so it is
# built once and never again. PHP itself comes from sury at build time: the image built on
# 2026-01-22 was still shipping 8.4.17 nine patch releases and 27 CVE fixes later.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  image:
    uses: ./.github/workflows/reusable-image.yml
    with:
      force-rebuild: true
    secrets: inherit

  verify:
    name: Report the PHP patch level that was built
    needs: image
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "the build ran" is not evidence the patch moved — a cached apt layer would also be green.
      - name: Print php -v from the image just pushed
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          docker pull "$IMAGE"
          VERSION=$(docker run --rm --entrypoint php "$IMAGE" -r 'echo PHP_VERSION;')
          echo "PHP in $IMAGE: $VERSION"
          echo "### PHP $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
