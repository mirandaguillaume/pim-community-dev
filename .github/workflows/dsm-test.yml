name: Design system tests

# Called by ci.yml, so that its result gates `ci-success`. It used to run on its own
# `pull_request` trigger, outside the required check: when the runner image moved under it
# (2026-11-15), the job went red on every branch and nothing stopped a merge.
on:
  workflow_call:

# Least privilege, whatever the caller grants: this job installs and runs third-party package code,
# and only reads the repository (cache and artifact upload use the Actions runtime token).
permissions:
  contents: read

jobs:
  test:
    name: Launch tests on the DSM
    # Pinned, not `ubuntu-latest`: the Playwright that @storybook/test-runner pulls in refuses
    # ubuntu-26.04 ("Playwright does not support chromium on ubuntu26.04-x64"), and the image
    # moving under the job is what broke it. Move this deliberately, with a Playwright that
    # supports the new image.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the current branch
        uses: actions/checkout@v4

      - name: Install node 22 for the rest of the workflow
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '**/front-packages/akeneo-design-system/node_modules'
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/front-packages/akeneo-design-system/yarn.lock') }}

      - name: Install peer dependencies
        # React 18 + styled-components 5 (peer deps for DSM)
        run: cd front-packages/akeneo-design-system && yarn add --dev react@^18.3.1 react-dom@^18.3.1 styled-components@^5.1.1

      - name: Install node modules
        run: cd front-packages/akeneo-design-system && yarn install

      - name: Generate a dummy component to test it with the others
        run: cd front-packages/akeneo-design-system && ./bin/dsm generate Dummy

      - name: Cache TypeScript build
        uses: actions/cache@v4
        env:
          cache-name: cache-typescript-build
        with:
          path: '**/front-packages/akeneo-design-system/tsconfig.build.tsbuildinfo'
          key: ${{ runner.os }}-typescript-${{ hashFiles('**/front-packages/akeneo-design-system/src') }}

      - name: Cache lib build
        uses: actions/cache@v4
        env:
          cache-name: cache-lib-build
        with:
          path: '**/front-packages/akeneo-design-system/lib'
          key: ${{ runner.os }}-lib-${{ hashFiles('**/front-packages/akeneo-design-system/src') }}

      - name: Make sure the lib build is successful
        run: cd front-packages/akeneo-design-system && yarn lib:build

      # lib/ must load outside webpack-like bundlers: every .svg it requires resolves inside lib/,
      # and every name of the CommonJS build imports statically from lib/esm (esbuild, as rollup
      # and so Vite would). Both used to fail without any consumer of this repository noticing.
      - name: Check the built package loads outside a configured bundler
        run: cd front-packages/akeneo-design-system && yarn lib:check

      - name: Launch lint checks
        run: cd front-packages/akeneo-design-system && yarn lint:check

      - uses: actions/cache@v4
        name: Cache jest cache
        env:
          cache-name: cache-jest-cache
        with:
          path: /tmp/jest/**
          key: ${{ runner.os }}-jest-cache

      - name: Launch unit tests
        run: cd front-packages/akeneo-design-system && yarn test:unit:run

      - name: Build storybook
        run: cd front-packages/akeneo-design-system && yarn storybook:build

      # Render-smoke every story via the Storybook test-runner (Playwright): a story that throws on
      # render fails here, and axe runs on each one against `.storybook/a11y-baseline.json`.
      - name: Run Storybook test-runner
        run: |
          cd front-packages/akeneo-design-system
          yarn playwright install chromium
          yarn test:storybook:ci

      - name: Cache example node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-example-node-modules
        with:
          path: '**/front-packages/akeneo-design-system/example/node_modules'
          key: ${{ runner.os }}-example-project-node-modules-${{ hashFiles('**/front-packages/akeneo-design-system/example/yarn.lock') }}

      # To check if the build is working, the directory `example` contains an integration of the lib
      # with a few tests. In the next step we will build this example and validate that it's working properly
      - name: Install example project dependencies
        run: cd front-packages/akeneo-design-system/example && rm -rf node_modules/akeneo-design-system && yarn install --check-files

      - name: Launch example integration tests
        run: cd front-packages/akeneo-design-system/example && yarn test

      - name: Upload the src folder on failure for debugging purposes
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: src-folder
          path: front-packages/akeneo-design-system/src
