name: build-php-image

on:
  workflow_call:

env:
  PHP_IMAGE: ghcr.io/${{ github.repository_owner }}/pim-php-dev:${{ github.sha }}
  PHP_IMAGE_CACHE: ghcr.io/${{ github.repository_owner }}/pim-php-dev:buildcache

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP image with cache
        run: |
          docker buildx build \
            --file Dockerfile \
            --tag "${PHP_IMAGE}" \
            --cache-from type=registry,ref="${PHP_IMAGE_CACHE}" \
            --cache-to type=registry,ref="${PHP_IMAGE_CACHE}",mode=max \
            --push .
