name: build-php-image

on:
  workflow_call:
    outputs:
      artifact:
        description: "Name of the saved PHP image artifact"
        value: php-pim-image

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-php-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-php-${{ runner.os }}-

      - name: Build PHP image with cache
        run: |
          docker buildx build \
            --file Dockerfile \
            --tag akeneo/pim-php-dev:8.1 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load .
          # move new cache into place for next run
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Save PHP image artifact
        run: docker save -o php-pim-image.tar akeneo/pim-php-dev:8.1

      - name: Upload PHP image artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-pim-image
          path: php-pim-image.tar
