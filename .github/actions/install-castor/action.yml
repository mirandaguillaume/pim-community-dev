name: 'Install Castor'
description: 'Download and cache the Castor PHP task runner'

inputs:
  version:
    description: 'Castor version to install (tag name without v prefix, or "latest")'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install Castor
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # Use the static binary (no PHP required), not the .phar.
        # Retry transient release-CDN errors: a single GitHub 504 on this download used to fail every
        # job of a run at once (lint, acceptance, PHPUnit, Behat, Playwright) before any test ran.
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
          https://github.com/jolicode/castor/releases/${{ inputs.version }}/download/castor.linux-amd64 \
          -o "$HOME/.local/bin/castor"
        chmod +x "$HOME/.local/bin/castor"
