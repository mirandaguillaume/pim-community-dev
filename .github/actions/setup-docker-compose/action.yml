name: 'Setup Docker Compose'
description: 'Ensures docker-compose command is available on the runner'

runs:
  using: 'composite'
  steps:
    - name: Ensure docker-compose is available
      shell: bash
      run: |
        set -euo pipefail

        if command -v docker-compose >/dev/null 2>&1; then
          echo "docker-compose already available"
          docker-compose version
          exit 0
        fi

        # Try to symlink from Docker CLI plugins
        for path in /usr/libexec/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose; do
          if [ -x "$path" ]; then
            sudo ln -sf "$path" /usr/local/bin/docker-compose
            echo "Symlinked docker-compose from $path"
            break
          fi
        done

        # Fallback: create wrapper script for 'docker compose'
        if ! command -v docker-compose >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
          printf '%s\n' '#!/usr/bin/env bash' 'exec docker compose "$@"' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          echo "Created docker-compose wrapper script"
        fi

        # Verify installation
        if command -v docker-compose >/dev/null 2>&1; then
          docker-compose version
        else
          echo "::error::docker-compose is not available and could not be installed"
          exit 1
        fi

    - name: Isolate Docker Compose project per job
      shell: bash
      run: |
        # Each job needs a unique project name AND unique ports, even when
        # multiple jobs land on the same self-hosted runner simultaneously.
        # GITHUB_RUN_ID is unique per workflow run, GITHUB_JOB per job key.
        # For matrix jobs, the caller must set MATRIX_INDEX env var.
        JOB_ID="${GITHUB_JOB:-default}"
        if [ -n "${MATRIX_INDEX:-}" ]; then JOB_ID="${JOB_ID}-${MATRIX_INDEX}"; fi
        COMPOSE_NAME="pim-${GITHUB_RUN_ID:-0}-${JOB_ID}"
        COMPOSE_NAME=$(echo "$COMPOSE_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g')
        echo "COMPOSE_PROJECT_NAME=${COMPOSE_NAME}" >> "$GITHUB_ENV"
        export COMPOSE_PROJECT_NAME="${COMPOSE_NAME}"
        echo "Docker Compose project: ${COMPOSE_NAME}"

        # Assign unique host ports per job to avoid bind conflicts.
        # Hash the unique compose name to get a stable port offset.
        HASH=$(echo "$COMPOSE_NAME" | md5sum | tr -d -c '0-9' | head -c8)
        # Use modulo to map into port range 10000-59999 (5000 slots × 10 ports each)
        SLOT=$(( HASH % 5000 ))
        OFFSET=$(( SLOT * 10 ))
        BASE=10000
        echo "DOCKER_PORT_HTTP=$(( BASE + OFFSET ))" >> "$GITHUB_ENV"
        echo "DOCKER_PORT_MYSQL=$(( BASE + OFFSET + 1 ))" >> "$GITHUB_ENV"
        echo "DOCKER_PORT_ELASTICSEARCH=$(( BASE + OFFSET + 2 ))" >> "$GITHUB_ENV"
        echo "DOCKER_PORT_SELENIUM=$(( BASE + OFFSET + 3 ))" >> "$GITHUB_ENV"
        echo "DOCKER_PORT_OBJECT_STORAGE=$(( BASE + OFFSET + 4 ))" >> "$GITHUB_ENV"
        echo "DOCKER_PORT_OBJECT_STORAGE_CONSOLE=$(( BASE + OFFSET + 5 ))" >> "$GITHUB_ENV"
        echo "DOCKER_PORT_GCS_EMULATOR=$(( BASE + OFFSET + 6 ))" >> "$GITHUB_ENV"
        echo "Port range: slot ${SLOT}, base port $(( BASE + OFFSET ))"

        # Clean up containers from previous runs of this same job.
        docker-compose down --remove-orphans 2>/dev/null || true
        # Also clean up legacy project names.
        COMPOSE_PROJECT_NAME=pim-community-dev docker-compose down --remove-orphans 2>/dev/null || true
